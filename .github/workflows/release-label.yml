name: release-label

# publish.yml picks the version bump from these labels, so a PR merged
# without one is never released. Make this a required status check.

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
    branches:
      - main

permissions: {}

jobs:
  release-label:
    name: release-label
    runs-on: ubuntu-latest

    permissions: {}

    steps:
      - name: Require exactly one release label
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          found=$(echo "$LABELS" | jq -r '[.[] | select(IN("patch", "minor", "major", "skip-release"))]')
          count=$(echo "$found" | jq 'length')
          if [ "$count" -ne 1 ]; then
            echo "::error::Add exactly one of the labels patch, minor, major or skip-release (found: $(echo "$found" | jq -r 'if length == 0 then "none" else join(", ") end'))."
            exit 1
          fi
          echo "Release label: $(echo "$found" | jq -r '.[0]')"
